<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FC1DE"/>
      <stop offset="1" stop-color="#164E7E"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F6FF"/>
      <stop offset="1" stop-color="#BFE3F7"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <circle cx="128" cy="128" r="120" fill="url(#sky)" stroke="#0C3D63" stroke-width="6"/>

  <!-- faint delineation contours (Tarseem = delineation) -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="3">
    <path d="M20 92  Q80 56 128 74  Q180 92 236 68"/>
    <path d="M14 126 Q80 96 128 110 Q184 124 242 104"/>
    <path d="M22 160 Q84 134 128 146 Q178 158 234 140"/>
  </g>

  <!-- A = mountain peak, crossbar = a contour line (raised 6px for the word) -->
  <g stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-6)">
    <path d="M46 176 L94 66 L138 176" fill="none"
          stroke="#FFFFFF" stroke-width="17"/>
    <path d="M68 136 Q94 124 118 136" fill="none"
          stroke="#FFD55A" stroke-width="10"/>
    <path d="M85 88 L94 66 L103 88" fill="#FFFFFF"/>
  </g>

  <!-- R whose leg becomes a meandering stream -->
  <g fill="none" stroke="#FFFFFF" stroke-width="17"
     stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-6)">
    <path d="M150 176 L150 66"/>
    <path d="M150 70 h30 a26 26 0 0 1 0 52 h-30"/>
  </g>
  <path d="M166 116 C186 132 172 146 186 160 C198 172 192 186 200 198"
        fill="none" stroke="url(#water)" stroke-width="14"
        stroke-linecap="round"/>

  <!-- pour point at the outlet -->
  <circle cx="200" cy="200" r="10" fill="#FFD55A" stroke="#7A5A00" stroke-width="3"/>

